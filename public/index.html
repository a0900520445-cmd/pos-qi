<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1a13">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LINE Pay POS 收銀機</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="pos">
  <div class="top"><span class="mark">LINE Pay</span><span>POS 收銀機</span><span class="sp"></span><span>機台 01</span><span class="num" id="clock"></span><span><i></i>已連線</span></div>
  <div class="main">
    <section class="ticket" aria-label="目前訂單">
      <div class="th"><b>訂單 <span class="num" id="ono">#0001</span></b><span id="sub">尚無品項</span></div>
      <div class="cols"><span>品名</span><span>數量</span><span>小計</span></div>
      <ul id="ticket"></ul>
      <div class="sumr"><span>品項數</span><span class="num" id="qty">0</span></div>
      <div class="tot"><span>應收金額</span><div class="amt num"><i>NT$</i><span id="amt">0</span></div></div>
      <div class="stat" id="note" aria-live="polite">請選擇商品或輸入金額。</div>
    </section>
    <section class="work" aria-label="商品與金額">
      <div class="seg" role="tablist"><button role="tab" id="t1" aria-selected="true">商品</button><button role="tab" id="t2" aria-selected="false">輸入金額</button></div>
      <div class="items" id="items"></div>
      <div class="pad" id="pad" hidden></div>
    </section>
  </div>
  <div class="under">
    <section class="card" aria-label="交易紀錄">
      <h2>今日交易紀錄</h2>
      <ul id="list"><li class="empty">還沒有交易</li></ul>
      <div class="tt"><span id="cnt">成功 0 筆</span><b class="num" id="sum">NT$ 0</b></div>
    </section>
    <details class="card">
      <summary>測試用 QR Code</summary>
      <div class="in">
        <p class="hint">付款碼內容格式為「LINE 金額」，例如「LINE 170」代表顧客付 170 元。產生後用另一支手機或螢幕顯示，再拍照掃描。</p>
        <div class="gen"><input id="gamt" class="num" type="number" inputmode="numeric" min="1" max="999999" value="170" aria-label="顧客付款金額"><button class="b2" id="gbtn" type="button">產生</button></div>
        <div class="qr" id="qr"></div>
        <div class="cap" id="cap"></div>
        <p class="hint">沒有第二個螢幕時，先設好應收金額，再直接模擬：</p>
        <div class="chips" id="chips"></div>
      </div>
    </details>
  </div>
</div>
<div class="fk"><div>
  <button class="btn alt" id="livebtn" type="button" disabled>即時相機</button>
  <button class="btn" id="photo" type="button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M7 12h10"/></svg>LINE Pay 掃碼收款</button>
</div></div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<div class="live" id="live"><video id="video" playsinline muted></video><div class="fr"></div><div class="top2"><span>應收 <b class="num" id="lbn"></b></span><button id="lclose" type="button">關閉</button></div></div>
<div id="host"></div>

<script src="/vendor/jsQR.js"></script>
<script src="/vendor/zxing.min.js"></script>
<script src="/vendor/qrcode.js"></script>
<script src="/js/scanner.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
